name: Python application

on:
  schedule:
    - cron: '53 * * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 优化点 1：只拉取最新的一次提交

    - name: Set up Python 3.12
      uses: actions/setup-python@v5 # 优化点 2：升级到 v5
      with:
        python-version: "3.12"
        cache: 'pip' # 优化点 3：开启自动 pip 缓存

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: run app
      env:
        PYTHONUNBUFFERED: 1
        # 【核心修复】直接在这里将 GitHub Secrets 注入为系统环境变量
        # 注意：请确保你在 GitHub 网页端设置的 Secret 名字也是这样全大写的
        SESSDATA: ${{ secrets.SESSDATA }}
        BILI_JCT: ${{ secrets.BILI_JCT }}
        DEDEUSERID: ${{ secrets.DEDEUSERID }}
      run: |
        python main.py
