name: Python application

on:
  schedule:
    - cron: '53 * * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 优化点 1：只拉取最新的一次提交

    - name: Set up Python 3.12
      uses: actions/setup-python@v5 # 优化点 2：升级到 v5
      with:
        python-version: "3.12"
        cache: 'pip' # 优化点 3：开启自动 pip 缓存

    - name: Install dependencies
      run: |
        # 缓存命中后，此步骤将极快完成
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 填充并验证 Cookies JSON
      env:
        SESSDATA: ${{ secrets.SESSDATA }}
        BILI_JCT: ${{ secrets.bili_jct }}
        DEDEUSERID: ${{ secrets.DedeUserID }}
      run: |
        jq -n \
          --arg sd "$SESSDATA" \
          --arg bj "$BILI_JCT" \
          --arg du "$DEDEUSERID" \
          '{SESSDATA: $sd, bili_jct: $bj, DedeUserID: $du}' > cookies.json

    - name: run app
      env:
        PYTHONUNBUFFERED: 1
      run: |
        python main.py
